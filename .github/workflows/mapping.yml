name: Mapping

on:
  push:
    paths: ["data/**", "icons/**", "site/**", "scripts/**", "README.md", "docs/**"]
  pull_request:
    paths: ["data/**", "icons/**", "site/**", "scripts/**", "README.md", "docs/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated README and docs/index.html are up to date
        run: python3 scripts/build.py --check
