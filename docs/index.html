<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Product Mapping</title>
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
<meta name="description" content="Cloud Product Mapping (AWS vs Azure vs GCP vs Oracle vs Exoscale) — interactive map of equivalent cloud services, with provider include/exclude.">
<script>
  // Apply the saved or system theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("cpm-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
/* ------------------------------------------------------------------ tokens */

/*
 * Light palette: applies to data-theme="light" and, because the dark block
 * below is screen-only, to print regardless of the selected theme.
 * Contrast (WCAG): text >= 14:1, muted >= 5.9:1, faint >= 3.5:1 on every
 * surface; badges >= 5:1; darkened provider accents >= 3:1.
 */
:root,
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #f1f4f8;
  --surface-hover: #e9eef5;
  --border: #dde2ea;
  --border-strong: #c5cdd8;
  --text: #161b26;
  --text-muted: #505a6b;
  --text-faint: #747e8e;
  --link: #161b26;
  --link-hover: #000000;
  --focus: #1d64d8;
  --topbar-bg: rgba(245, 247, 250, 0.86);
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
  --badge-marketplace-bg: rgba(29, 100, 216, 0.10);
  --badge-marketplace-fg: #1a56c4;
  --badge-roadmap-bg: rgba(232, 163, 23, 0.18);
  --badge-roadmap-fg: #8a4b00;
  --badge-workaround-bg: rgba(124, 58, 237, 0.10);
  --badge-workaround-fg: #6d28d9;
  --status-native: #15803d;
  --status-marketplace: #1a56c4;
  --status-workaround: #6d28d9;
  --status-none: #9aa3b2;
  --provider-tint: 12%;
  /* Brand colors like AWS orange / GCP green wash out on white: darken the
     accent (bars, dots, chip borders) by mixing in some black. */
  --provider-shade: 22%;
  --provider-border-mix: 80%;
}

@media not print {
  :root,
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1017;
    --surface: #151a23;
    --surface-2: #1b212c;
    --surface-hover: #222a37;
    --border: #262e3b;
    --border-strong: #354052;
    --text: #e6e9ef;
    --text-muted: #8e98a8;
    --text-faint: #6a7488;
    --link: #e6e9ef;
    --link-hover: #ffffff;
    --focus: #6ea8fe;
    --topbar-bg: rgba(13, 16, 23, 0.86);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
    --badge-marketplace-bg: rgba(110, 168, 254, 0.14);
    --badge-marketplace-fg: #9cc3ff;
    --badge-roadmap-bg: rgba(240, 180, 60, 0.14);
    --badge-roadmap-fg: #f3c56b;
    --badge-workaround-bg: rgba(167, 139, 250, 0.14);
    --badge-workaround-fg: #c4b5fd;
    --status-native: #4ade80;
    --status-marketplace: #9cc3ff;
    --status-workaround: #c4b5fd;
    --status-none: #6a7488;
    --provider-tint: 10%;
    --provider-shade: 0%;
    --provider-border-mix: 55%;
  }
}

/* Per-element provider accent (--provider is set inline from data). */
.chip,
.matrix__cell {
  --provider-accent: color-mix(in srgb, var(--provider), black var(--provider-shade));
}

/* ------------------------------------------------------------------ base */

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

code { font: 0.92em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

/* ------------------------------------------------------------------ top bar */

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--topbar-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.topbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: 1600px;
  margin: 0 auto;
  padding: 12px 24px;
}

.topbar__providers { padding-top: 0; flex-wrap: wrap; }

.brand__title { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
.brand__subtitle { margin: 2px 0 0; color: var(--text-muted); font-size: 13px; }

.controls { display: flex; align-items: center; gap: 8px; }

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(340px, 50vw);
  padding: 0 10px;
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.search:focus-within { border-color: var(--focus); }
.search svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; }
.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
}
.search input::placeholder { color: var(--text-faint); }

.icon-button {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
}
.icon-button:hover { background: var(--surface-hover); }
.icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:root[data-theme="dark"] .icon-moon,
:root[data-theme="light"] .icon-sun { display: none; }

/* ------------------------------------------------------------------ provider chips */

.providers {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
  padding: 0;
  border: 0;
}

.chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  transition: background-color 120ms, border-color 120ms, color 120ms;
}
.chip:hover { background: var(--surface-hover); }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.chip:has(input:checked) {
  color: var(--text);
  border-color: color-mix(in srgb, var(--provider-accent) var(--provider-border-mix), var(--border));
  background: color-mix(in srgb, var(--provider-accent) var(--provider-tint), var(--surface));
}
.chip:not(:has(input:checked)) .chip__dot { background: transparent; box-shadow: inset 0 0 0 2px var(--text-faint); }
.chip__name { font-weight: 600; }
.chip__count { font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

.chip__dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 50%;
  background: var(--provider-accent);
}

.legend { display: flex; align-items: center; gap: 6px; }

/* ------------------------------------------------------------------ badges */

.badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap;
}
.badge--marketplace { background: var(--badge-marketplace-bg); color: var(--badge-marketplace-fg); }
.badge--roadmap { background: var(--badge-roadmap-bg); color: var(--badge-roadmap-fg); }
.badge--workaround { background: var(--badge-workaround-bg); color: var(--badge-workaround-fg); }
.product--workaround .product__name { color: var(--text-muted); }

/* ------------------------------------------------------------------ view bar */

.viewbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.viewbar[hidden] { display: none; }

.tabs {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.tab {
  height: 30px;
  padding: 0 14px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--surface-hover); color: var(--text); box-shadow: var(--shadow); }

.status-filters { display: flex; flex-wrap: wrap; gap: 8px; }
.status-filters[hidden] { display: none; }
.status-chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
}
.status-chip:hover { background: var(--surface-hover); }
.status-chip input { position: absolute; opacity: 0; pointer-events: none; }
.status-chip:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.status-chip:has(input:checked) { color: var(--text); border-color: var(--status-color); }

.status-chip--native, .status--native { --status-color: var(--status-native); }
.status-chip--marketplace, .status--marketplace { --status-color: var(--status-marketplace); }
.status-chip--workaround, .status--workaround { --status-color: var(--status-workaround); }
.status-chip--none, .status--none { --status-color: var(--status-none); }

.status-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--status-color); }
.status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 600; }

/* ------------------------------------------------------------------ crosswalk */

.crosswalk {
  display: grid;
  grid-template-columns: minmax(120px, 0.8fr) minmax(160px, 1.2fr) minmax(200px, 1.5fr) minmax(120px, 0.7fr) minmax(200px, 2fr);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: clip;
}
.crosswalk[hidden], .matrix[hidden] { display: none; }
.crosswalk__row { display: contents; }
.crosswalk__cell {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  min-width: 0;
}
.crosswalk__row--head .crosswalk__cell {
  position: sticky;
  top: var(--topbar-height, 0px);
  z-index: 2;
  border-top: 0;
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.crosswalk__cell--category { color: var(--text-muted); }
.crosswalk__cell--service a { font-weight: 600; }
.crosswalk__cell--note { color: var(--text-muted); }
.crosswalk__row:not(.crosswalk__row--head):hover .crosswalk__cell { background-color: var(--surface-hover); }

/* ------------------------------------------------------------------ matrix */

main { max-width: 1600px; margin: 0 auto; padding: 20px 24px 40px; }

.matrix {
  display: grid;
  grid-template-columns: minmax(150px, 190px) repeat(var(--columns), minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: clip;
}

.matrix__row { display: contents; }

.matrix__cell {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  border-left: 1px solid var(--border);
  min-width: 0;
}
.matrix__cell:first-child { border-left: 0; }

.matrix__row--head .matrix__cell {
  position: sticky;
  top: var(--topbar-height, 0px);
  z-index: 2;
  border-top: 0;
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.matrix__cell--provider { box-shadow: inset 0 -3px 0 var(--provider-accent); }
.provider-head { display: inline-flex; align-items: center; gap: 8px; color: var(--text); }

.matrix__cell--category {
  font-weight: 600;
  color: var(--text);
  background: var(--surface-2);
}

.matrix__row:not(.matrix__row--head):hover .matrix__cell { background-color: var(--surface-hover); }

.none { color: var(--text-faint); }

.products {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

/* Wraps so a badge drops onto its own line (indented under the name) in
   narrow columns instead of squeezing the name to one letter per line.
   The padding + negative icon margin make wrapped lines start at the name. */
.product {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 8px;
  min-width: 0;
  padding-left: 26px; /* icon width (18px) + gap (8px) */
}
.product > .product__icon { margin-left: -26px; }

.product__name { flex: 1 1 0; min-width: 8ch; overflow-wrap: anywhere; }
.product--roadmap .product__name { color: var(--text-muted); font-style: italic; }

.product__icon {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  flex: none;
}
.product__icon svg { width: 18px; height: 18px; display: block; }
.product__icon--dot::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--provider-accent);
  opacity: 0.85;
}

.empty { padding: 40px 0; text-align: center; color: var(--text-muted); }

.footer {
  max-width: 1600px;
  margin: 0 auto;
  padding: 0 24px 32px;
  color: var(--text-faint);
  font-size: 12px;
}
.footer a { color: var(--text-muted); text-decoration: underline; }

/* ------------------------------------------------------------------ small screens */

@media (max-width: 900px) {
  /* The wrapped top bar is too tall to pin on phones. */
  .topbar { position: static; }
  .matrix__row--head .matrix__cell, .crosswalk__row--head .crosswalk__cell { top: 0; }
  .topbar__inner { padding: 10px 16px; flex-wrap: wrap; }
  .controls { width: 100%; }
  .search { flex: 1; width: auto; }
  main { padding: 16px 16px 32px; }
  .footer { padding: 0 16px 24px; }

  .matrix { display: block; background: transparent; border: 0; border-radius: 0; overflow: visible; }
  /* Doubled class so the `.matrix__row { display: block }` below can't override it. */
  .matrix__row.matrix__row--head { display: none; }
  .matrix__row {
    display: block;
    margin-bottom: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .matrix__cell { border-left: 0; }
  .matrix__cell:first-child { border-top: 0; }
  .matrix__cell--none { display: none; }

  .crosswalk { display: block; background: transparent; border: 0; border-radius: 0; overflow: visible; }
  .crosswalk__row.crosswalk__row--head { display: none; }
  .crosswalk__row {
    display: grid;
    grid-template-columns: 1fr auto;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .crosswalk__cell { border-top: 0; padding: 8px 14px; }
  .crosswalk__cell--category { grid-column: 1; grid-row: 1; padding-bottom: 0; font-size: 12px; }
  .crosswalk__row > .crosswalk__cell:nth-child(4) { grid-column: 2; grid-row: 1 / span 2; align-self: start; padding-top: 10px; }
  .crosswalk__cell--service { grid-column: 1; grid-row: 2; padding-top: 2px; }
  .crosswalk__row > .crosswalk__cell:nth-child(3) { grid-column: 1 / -1; border-top: 1px solid var(--border); }
  .crosswalk__cell--note { grid-column: 1 / -1; padding-top: 0; }
  .crosswalk__cell--note:empty { display: none; }
  .matrix__cell:not(.matrix__cell--category)::before {
    content: attr(data-provider);
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-left: 3px solid var(--provider-accent);
    padding-left: 6px;
  }
}

/* ------------------------------------------------------------------ print */

/* Light tokens apply automatically (dark block is `not print`). */
@media print {
  .topbar { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
  .controls, .topbar__providers, #theme-toggle { display: none; }
  .viewbar { display: none; }
  .badge, .chip__dot, .status-dot, .matrix__cell--provider, .matrix__cell--category, .product__icon {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .matrix__row--head .matrix__cell { position: static; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <h1 class="brand__title">Cloud Product Mapping</h1>
      <p class="brand__subtitle" id="subtitle"></p>
    </div>
    <div class="controls">
      <label class="search">
        <span class="visually-hidden">Search products</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search products or categories…" autocomplete="off">
      </label>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle light/dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
  <div class="topbar__inner topbar__providers">
    <fieldset class="providers" id="providers">
      <legend class="visually-hidden">Cloud providers to include</legend>
    </fieldset>
    <div class="legend" id="legend"></div>
  </div>
</header>

<main id="main">
  <div class="viewbar" id="viewbar" hidden>
    <div class="tabs" role="tablist" aria-label="View" id="tabs"></div>
    <div class="status-filters" id="status-filters" hidden></div>
  </div>
  <div class="matrix" id="matrix" role="table" aria-label="Cloud product mapping"></div>
  <div class="crosswalk" id="crosswalk" role="table" hidden></div>
  <p class="empty" id="empty" hidden>No products match your filters.</p>
</main>

<footer class="footer">
  Generated from <code>data/</code> by <code>scripts/build.py</code>. Exoscale icons from the
  <a href="https://community.exoscale.com/tools/icon-table/">official Exoscale icon library</a>.
</footer>

(function () {
  "use strict";

  var data = window.CPM_DATA;
  var providers = data.providers;

      return providerIds.indexOf(id) !== -1 && excludedFromUrl.indexOf(id) === -1;
    })),
    query: params.get("q") || "",
    view: params.get("view") || "matrix",
    statuses: new Set((params.get("status") || "").split(",").filter(Boolean)),
  };
  var crosswalks = data.crosswalks || [];
  if (state.visible.size === 0) providerIds.forEach(function (id) { state.visible.add(id); });

  function persist() {
    var visible = providerIds.filter(function (id) { return state.visible.has(id); });
    try { localStorage.setItem("cpm-providers", visible.join(",")); } catch (e) {}
    var p = new URLSearchParams(location.search);
    p.delete("exclude");
    if (visible.length === providerIds.length) p.delete("providers"); else p.set("providers", visible.join(","));
    if (state.query) p.set("q", state.query); else p.delete("q");
    if (state.view !== "matrix") p.set("view", state.view); else p.delete("view");
    if (state.statuses.size) p.set("status", Array.from(state.statuses).join(",")); else p.delete("status");
    var qs = p.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
  }

  // ------------------------------------------------------------------ helpers

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k === "style") node.setAttribute("style", attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function count(providerId) {
    var m = data.mapping[providerId] || {};
    return Object.keys(m).reduce(function (n, k) { return n + m[k].length; }, 0);
  }

  function icon(provider, item) {
    var key = provider.iconBase && item.icon ? provider.iconBase + item.icon : null;
    var wrap = el("span", { class: "product__icon", "aria-hidden": "true" });
    if (key && data.icons[key]) {
      wrap.innerHTML = data.icons[key];
    } else {
      wrap.classList.add("product__icon--dot");
    }
    return wrap;
  }

  function matches(text, q) {
    return text.toLowerCase().indexOf(q) !== -1;
  }

  function productItem(provider, item) {
    var kind = item.status || item.source;
    var name = item.url
      ? el("a", { href: item.url, class: "product__name", rel: "noopener", target: "_blank" })
      : el("span", { class: "product__name" });
    name.textContent = item.name;
    return el("li", { class: "product" + (kind ? " product--" + kind : "") }, [
      icon(provider, item),
      name,
      kind && data.badges[kind] ? el("span", { class: "badge badge--" + kind, text: data.badges[kind] }) : null,
    ]);
  }

  function providerById(id) {
    return providers.filter(function (p) { return p.id === id; })[0];
  }

  // ------------------------------------------------------------------ static chrome

  function renderSubtitle() {
    var names = providers.filter(function (p) { return state.visible.has(p.id); })
      .map(function (p) { return p.name; });
    els.subtitle.textContent = names.join(" vs ");
    document.title = "Cloud Product Mapping — " + names.join(" vs ");
  }

  function renderProviderToggles() {
    providers.forEach(function (p) {
      var input = el("input", { type: "checkbox", value: p.id, id: "provider-" + p.id });
      input.checked = state.visible.has(p.id);
      input.addEventListener("change", function () {
        if (input.checked) state.visible.add(p.id);
        else if (state.visible.size > 1) state.visible.delete(p.id);
        else { input.checked = true; return; } // keep at least one provider
        persist();
        render();
      });
      var label = el("label", {
        class: "chip",
        for: "provider-" + p.id,
        title: p.fullName,
        style: "--provider:" + p.color,
      }, [
        input,
        el("span", { class: "chip__dot", "aria-hidden": "true" }),
        el("span", { class: "chip__name", text: p.name }),
        el("span", { class: "chip__count", text: String(count(p.id)) }),
      ]);
      els.providers.appendChild(label);
    });
  }

  function renderLegend() {
    Object.keys(data.badges).forEach(function (kind) {
      els.legend.appendChild(el("span", { class: "badge badge--" + kind, text: data.badges[kind] }));
    });
  }

  // ------------------------------------------------------------------ matrix

  function activeCrosswalk() {
    var id = state.view.indexOf("crosswalk:") === 0 ? state.view.slice(10) : null;
    return crosswalks.filter(function (cw) {
      return cw.from + "-" + cw.to === id && state.visible.has(cw.from) && state.visible.has(cw.to);
    })[0] || null;
  }

  function renderTabs() {
    var available = crosswalks.filter(function (cw) { return state.visible.has(cw.from) && state.visible.has(cw.to); });
    els.viewbar.hidden = available.length === 0;
    if (!activeCrosswalk()) state.view = "matrix";
    els.tabs.textContent = "";
    var tabs = [{ id: "matrix", label: "By category" }].concat(available.map(function (cw) {
      return { id: "crosswalk:" + cw.from + "-" + cw.to, label: providerById(cw.from).name + " → " + providerById(cw.to).name + " crosswalk" };
    }));
    tabs.forEach(function (tab) {
      var button = el("button", {
        type: "button", role: "tab", class: "tab", "aria-selected": String(state.view === tab.id), text: tab.label,
      });
      button.addEventListener("click", function () {
        state.view = tab.id;
        persist();
        render();
      });
      els.tabs.appendChild(button);
    });
  }

  function crosswalkRowMatches(cw, row, q) {
    if (!q) return true;
    var names = row[cw.to].map(function (i) { return i.name; });
    return [row.category, row.service, row.note || ""].concat(names).some(function (s) { return matches(s, q); });
  }

  function renderCrosswalk(cw) {
    var q = state.query.trim().toLowerCase();
    var src = providerById(cw.from), dst = providerById(cw.to);
    var searched = cw.rows.filter(function (r) { return crosswalkRowMatches(cw, r, q); });

    // Status filter chips with counts for the current search.
    els.statusFilters.hidden = false;
    els.statusFilters.textContent = "";
    Object.keys(data.crosswalkStatus).forEach(function (status) {
      var n = searched.filter(function (r) { return r.status === status; }).length;
      var input = el("input", { type: "checkbox", value: status, id: "status-" + status });
      input.checked = state.statuses.has(status);
      input.addEventListener("change", function () {
        if (input.checked) state.statuses.add(status); else state.statuses.delete(status);
        persist();
        render();
      });
      els.statusFilters.appendChild(el("label", { class: "status-chip status-chip--" + status, for: "status-" + status }, [
        input,
        el("span", { class: "status-dot", "aria-hidden": "true" }),
        el("span", { text: data.crosswalkStatus[status] }),
        el("span", { class: "chip__count", text: String(n) }),
      ]));
    });

    var rows = searched.filter(function (r) { return !state.statuses.size || state.statuses.has(r.status); });
    els.crosswalk.textContent = "";
    els.crosswalk.setAttribute("aria-label", src.name + " to " + dst.name + " crosswalk");
    var head = el("div", { class: "crosswalk__row crosswalk__row--head", role: "row" });
    ["Category", src.name + " service", dst.name, "Status", "Notes"].forEach(function (label) {
      head.appendChild(el("div", { class: "crosswalk__cell", role: "columnheader", text: label }));
    });
    els.crosswalk.appendChild(head);

    rows.forEach(function (r) {
      var list = el("ul", { class: "products" });
      r[cw.to].forEach(function (item) { list.appendChild(productItem(dst, item)); });
      els.crosswalk.appendChild(el("div", { class: "crosswalk__row", role: "row" }, [
        el("div", { class: "crosswalk__cell crosswalk__cell--category", role: "cell", text: r.category }),
        el("div", { class: "crosswalk__cell crosswalk__cell--service", role: "cell", style: "--provider:" + src.color }, [
          el("a", { href: r.url, rel: "noopener", target: "_blank", text: r.service }),
        ]),
        el("div", { class: "crosswalk__cell", role: "cell", style: "--provider:" + dst.color }, [
          r[cw.to].length ? list : el("span", { class: "none", text: "—" }),
        ]),
        el("div", { class: "crosswalk__cell", role: "cell" }, [
          el("span", { class: "status status--" + r.status }, [
            el("span", { class: "status-dot", "aria-hidden": "true" }),
            el("span", { text: data.crosswalkStatus[r.status] }),
          ]),
        ]),
        el("div", { class: "crosswalk__cell crosswalk__cell--note", role: "cell", text: r.note || "" }),
      ]));
    });
    return rows.length;
  }

  function render() {
    renderSubtitle();
    renderTabs();
    var cw = activeCrosswalk();
    els.matrix.hidden = !!cw;
    els.crosswalk.hidden = !cw;
    els.statusFilters.hidden = !cw;
    if (cw) {
      els.empty.hidden = renderCrosswalk(cw) > 0;
      return;
    }
    renderMatrix();
  }

  function renderMatrix() {
    var visible = providers.filter(function (p) { return state.visible.has(p.id); });
    var q = state.query.trim().toLowerCase();

    els.matrix.style.setProperty("--columns", visible.length);
    els.matrix.textContent = "";

    var head = el("div", { class: "matrix__row matrix__row--head", role: "row" }, [
      el("div", { class: "matrix__cell matrix__cell--category", role: "columnheader", text: "Category" }),
    ]);
    visible.forEach(function (p) {
      head.appendChild(el("div", {
        class: "matrix__cell matrix__cell--provider", role: "columnheader", style: "--provider:" + p.color,
      }, [
        el("a", { href: p.homepage, class: "provider-head", rel: "noopener" }, [
          el("span", { class: "chip__dot", "aria-hidden": "true" }),
          el("span", { text: p.name }),
        ]),
      ]));
    });
    els.matrix.appendChild(head);

    var shown = 0;
    data.categories.forEach(function (cat) {
      var categoryHit = q && matches(cat.name, q);
      var cells = visible.map(function (p) {
        var items = (data.mapping[p.id] || {})[cat.id] || [];
        if (q && !categoryHit) {
          items = items.filter(function (i) { return matches(i.name, q); });
        }
        return { provider: p, items: items };
      });
      // Hide categories where no visible provider has a (matching) product.
      if (!cells.some(function (c) { return c.items.length; })) return;
      shown++;

      var row = el("div", { class: "matrix__row", role: "row" }, [
        el("div", { class: "matrix__cell matrix__cell--category", role: "rowheader", text: cat.name }),
      ]);
      cells.forEach(function (c) {
        var cell = el("div", {
          class: "matrix__cell" + (c.items.length ? "" : " matrix__cell--none"),
          role: "cell",
          style: "--provider:" + c.provider.color,
          "data-provider": c.provider.name,
        });
        if (!c.items.length) {
          cell.appendChild(el("span", { class: "none", text: "—", "aria-label": "No equivalent" }));
        }
        var list = el("ul", { class: "products" });
        c.items.forEach(function (item) { list.appendChild(productItem(c.provider, item)); });
        if (c.items.length) cell.appendChild(list);
        row.appendChild(cell);
      });
      els.matrix.appendChild(row);
    });

    els.empty.hidden = shown > 0;
  }

  // ------------------------------------------------------------------ theme

  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("cpm-theme", theme); } catch (e) {}
  }

  els.themeToggle.addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
  });

  // ------------------------------------------------------------------ init

  els.search.value = state.query;
  var searchTimer;
  els.search.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = els.search.value;
      persist();
      render();
    }, 80);
  });

  // Keep the matrix header pinned just below the sticky top bar.
  var topbar = document.querySelector(".topbar");
  function syncTopbarHeight() {
    document.documentElement.style.setProperty("--topbar-height", topbar.offsetHeight + "px");
  }
  if (window.ResizeObserver) new ResizeObserver(syncTopbarHeight).observe(topbar);
  syncTopbarHeight();

  renderProviderToggles();
  renderLegend();
  render();
})();

</script>
</body>
</html>
